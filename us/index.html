<!doctype html>
<html lang="en-US">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="description" content="Taxi transfers, websites, and e-bike and scooter repairs in Koper, Slovenia.">
	<link rel="icon" href="../images/favicon.ico" type="image/x-icon">
	<link rel="stylesheet" href="style.css">
	<title>Chary | Taxi and Transfers</title>
</head>
<body>
	<div id="screen">
		<nav class="language-switcher" aria-label="Choose language">
			<button class="language-switcher__button" type="button" data-language="de" data-page="../at/index.html" aria-label="Deutsch" title="Deutsch" aria-pressed="false">
				<img src="../images/at.png" alt="">
			</button>
			<button class="language-switcher__button" type="button" data-language="it" data-page="../it/index.html" aria-label="Italiano" title="Italiano" aria-pressed="false">
				<img src="../images/it.png" alt="">
			</button>
			<button class="language-switcher__button" type="button" data-language="sl" data-page="../index.html" aria-label="Slovenščina" title="Slovenščina" aria-pressed="false">
				<img src="../images/si.png" alt="">
			</button>
		</nav>
		<img src="../images/taxilogo2.png" alt="Taxi logo">
		<div class="center-buttons">
			<button class="center-button center-button--primary center-button--american" type="button" disabled>
				<span class="center-button__star center-button__star--multi" aria-hidden="true"><span class="center-button__star-trail"></span><span class="center-button__star-shape"></span></span>
				<span class="center-button__star center-button__star--multi" aria-hidden="true"><span class="center-button__star-trail"></span><span class="center-button__star-shape"></span></span>
				<span class="center-button__star center-button__star--multi" aria-hidden="true"><span class="center-button__star-trail"></span><span class="center-button__star-shape"></span></span>
				<span class="center-button__star center-button__star--multi" aria-hidden="true"><span class="center-button__star-trail"></span><span class="center-button__star-shape"></span></span>
				<span class="center-button__star center-button__star--multi" aria-hidden="true"><span class="center-button__star-trail"></span><span class="center-button__star-shape"></span></span>
				<span class="center-button__star center-button__star--multi" aria-hidden="true"><span class="center-button__star-trail"></span><span class="center-button__star-shape"></span></span>
				<span class="center-button__star center-button__star--multi" aria-hidden="true"><span class="center-button__star-trail"></span><span class="center-button__star-shape"></span></span>
				<span class="center-button__star center-button__star--multi" aria-hidden="true"><span class="center-button__star-trail"></span><span class="center-button__star-shape"></span></span>
				<span class="center-button__label animated-text">TAXI - TRANSFER</span>
			</button>
			<button class="center-button" type="button" disabled>
				<span class="center-button__star center-button__star--second" aria-hidden="true"></span>
				<span class="center-button__label animated-text">WEBSITES</span>
			</button>
			<button class="center-button center-button--long" type="button" disabled>
				<span class="center-button__star center-button__star--third" aria-hidden="true"></span>
				<span class="center-button__label animated-text center-button__label--long">E-BIKE &amp; SCOOTER REPAIRS</span>
			</button>
		</div>
		<svg class="stick-man" viewBox="0 -4 40 76" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
			<g class="stick-man__leg stick-man__leg--left">
				<path d="M20 43 13 52 9 66" />
			</g>
			<g class="stick-man__leg stick-man__leg--right">
				<path d="M20 43 27 52 31 66" />
			</g>
			<g class="stick-man__torso">
				<circle cx="20" cy="10" r="6" />
				<path d="m25 9 4 1.5-4 1.5M20 18v25" />
				<path d="M11 4c.6-5 3.7-8 9-8s8.4 3 9 8H11Z" fill="currentColor" />
				<path d="M8 4c3-1.5 21-1.5 24 0l-2 2H10z" fill="currentColor" />
			</g>
			<g class="stick-man__arm stick-man__arm--left">
				<path d="M20 25 13 31 16 37" />
			</g>
			<g class="stick-man__arm stick-man__arm--right">
				<path d="M20 25 27 31 24 37" />
			</g>
		</svg>
		<svg class="stick-cloud" viewBox="0 0 40 26" fill="currentColor" aria-hidden="true" focusable="false">
			<path d="M31.4 22H10a8 8 0 0 1-.9-15.9A11.5 11.5 0 0 1 31 9.3 6.4 6.4 0 0 1 31.4 22Z" />
		</svg>
		<div class="contact-info">
			<span class="phone-number animated-text">+38664188332</span>
			<a class="contact-email animated-text" href="mailto:chary.koper@gmail.com">CHARY.KOPER@GMAIL.COM</a>
			<small class="copyright animated-text">© 2026 CHARY. All rights reserved.</small>
		</div>
		<svg class="phone-star" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
			<path d="m12 1.5 2.9 6.2 6.8.8-5 4.7 1.3 6.7-6-3.3-6 3.3 1.2-6.7-4.9-4.7 6.8-.8L12 1.5Z" fill="currentColor" />
		</svg>
		<svg class="star-flight-path" aria-hidden="true" focusable="false"><path></path></svg>
		<button class="call-button" type="button" aria-label="Call">
			<span class="call-button__trail" aria-hidden="true"></span>
			<span class="call-button__trail call-button__trail--second" aria-hidden="true"></span>
			<span class="call-button__trail call-button__trail--third" aria-hidden="true"></span>
			<span class="call-button__spark" aria-hidden="true"></span>
			<span class="call-button__spark call-button__spark--second" aria-hidden="true"></span>
			<span class="call-button__spark call-button__spark--third" aria-hidden="true"></span>
			<svg class="call-button__icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
				<path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.12.96.36 1.9.7 2.8a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.9.34 1.84.58 2.8.7A2 2 0 0 1 22 16.92z" />
			</svg>
		</button>
	</div>
	<script>
		const translations = {
			sl: {
				buttons: ['TAXI - TRANSFER', 'SPLETNE STRANI', 'POPRAVILA E-KOLES SKIROJEV'],
				copyright: '© 2026 CHARY'
			},
			de: {
				buttons: ['TAXI - TRANSFER', 'WEBSEITEN', 'E-BIKE- UND SCOOTER-REPARATUR'],
				copyright: '© 2026 CHARY. Alle Rechte vorbehalten.'
			},
			it: {
				buttons: ['TAXI - TRANSFER', 'SITI WEB', 'RIPARAZIONE E-BIKE E MONOPATTINI'],
				copyright: '© 2026 CHARY. Tutti i diritti riservati.'
			},
			en: {
				buttons: ['TAXI - TRANSFER', 'WEBSITES', 'E-BIKE & SCOOTER REPAIRS'],
				copyright: '© 2026 CHARY. All rights reserved.'
			}
		};
		const languageButtons = [...document.querySelectorAll('.language-switcher__button')];
		const documentLanguage = document.documentElement.lang.toLowerCase();
		const language = documentLanguage.startsWith('de') ? 'de' : documentLanguage.startsWith('it') ? 'it' : documentLanguage.startsWith('en') ? 'en' : 'sl';
		const translation = translations[language];
		const buttonLabels = [...document.querySelectorAll('.center-button__label')];
		buttonLabels.forEach((label, index) => {
			label.textContent = translation.buttons[index];
			label.style.fontSize = '';
			const button = label.closest('.center-button');
			const buttonStyle = getComputedStyle(button);
			const availableWidth = button.clientWidth - parseFloat(buttonStyle.paddingLeft) - parseFloat(buttonStyle.paddingRight);
			const requiredWidth = label.scrollWidth;
			if (requiredWidth > availableWidth) {
				const currentFontSize = parseFloat(getComputedStyle(label).fontSize);
				label.style.fontSize = `${currentFontSize * availableWidth / requiredWidth}px`;
			}
		});
		document.querySelector('.copyright').textContent = translation.copyright;
		document.documentElement.lang = documentLanguage;
		languageButtons.forEach(button => {
			button.setAttribute('aria-pressed', String(button.dataset.language === language));
			button.addEventListener('click', () => {
				window.location.assign(button.dataset.page);
			});
		});

		
		const textTargets = [...buttonLabels, document.querySelector(".phone-number"), document.querySelector(".contact-email"), document.querySelector(".copyright")];
		const buttonTrails = document.querySelectorAll(".center-button");

		for (const button of buttonTrails) {
			if (button.classList.contains("center-button--american")) continue;

			const bounds = button.getBoundingClientRect();
			const perimeter = 2 * (bounds.width - bounds.height) + Math.PI * bounds.height;
			const trailLength = perimeter / 2;
			const duration = parseFloat(getComputedStyle(button).getPropertyValue("--star-speed")) * 1000;
			const segmentCount = Math.max(10, Math.ceil(trailLength / 5));
			const delaySpan = duration * trailLength / perimeter;

			for (let index = 0; index < segmentCount; index += 1) {
				const progress = index / (segmentCount - 1);
				const segment = document.createElement("span");
				segment.className = "center-button__trail-segment";
				segment.style.setProperty("--trail-delay", `${delaySpan * progress}ms`);
				segment.style.setProperty("--trail-opacity", String(1 - progress * 0.92));
				segment.style.setProperty("--trail-width", `${trailLength / (segmentCount - 1) * 1.05}px`);
				button.append(segment);
			}
		}

		textTargets.forEach(element => {
			element.style.clipPath = "none";
		});
		buttonTrails.forEach(button => {
			button.disabled = false;
			button.classList.add("center-button--star-active");
		});

	</script>
</body>
</html>
